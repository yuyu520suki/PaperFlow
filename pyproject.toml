[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperflow"
version = "0.1.0"
description = "Template-based Windows Word workflow with native citation and equation preservation"
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.2,<2", "lxml>=6,<7", "Pillow>=12,<13", "PyMuPDF>=1.28,<2",
  "pywin32>=311; platform_system == 'Windows'", "mcp>=1.30,<2",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.10,<4"]

[project.scripts]
paperflow = "paperflow.cli:main"

[tool.setuptools.packages.find]
include = ["paperflow*"]
